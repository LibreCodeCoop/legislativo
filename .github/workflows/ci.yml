name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: php-cs-fixer
        run: composer cs:check || true

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: phpstan
        run: composer stan

  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPUnit
        run: composer test

  nextcloud-compat:
    name: Nextcloud ${{ matrix.nextcloud }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nextcloud: 'stable32'
            php: '8.1'
          - nextcloud: 'stable33'
            php: '8.2'
          - nextcloud: 'stable35'
            php: '8.3'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: nextcloud
          POSTGRES_DB: nextcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_pgsql, gd, intl, zip
          tools: composer

      - name: Setup Nextcloud
        run: |
          curl -sSL "https://download.nextcloud.com/server/releases/${{ matrix.nextcloud }}.tar.bz2" | tar xj
          cd nextcloud
          php occ maintenance:install \
            --admin-user admin --admin-pass admin \
            --database pgsql --database-name nextcloud \
            --database-user nextcloud --database-pass nextcloud \
            --database-host 127.0.0.1
          cd ..
          ln -s "$GITHUB_WORKSPACE" nextcloud/apps/legislativo
          php nextcloud/occ app:enable legislativo

      - name: Verify installation
        run: |
          php nextcloud/occ migrations:status legislativo
